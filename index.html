<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WFA PROCUREMENT - NEIL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🧊</text></svg>">
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">
          <!-- Put your company logo file at ./assets/logo.png -->
          <img src="./assets/logo.png" alt="Woodward Foods logo">
        </div>
        <div class="brand-text">
          <strong>WFA Procurement - NEIL</strong>
          <small>Inventory · Pallets · SDS</small>
        </div>
        <button class="burger" id="btnCollapse" aria-label="Toggle sidebar" title="Toggle sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <nav class="nav">
        <a href="#/home" class="nav-link active" data-icon="home">
          <span class="icon">🏠</span><span class="text">Home</span>
        </a>

        <div class="nav-group">
          <button class="nav-link has-children" data-icon="inv" aria-expanded="true">
            <span class="icon">📦</span><span class="text">Inventory</span>
            <span class="chev">▾</span>
          </button>
          <div class="nav-children" id="invCats">
            <!-- categories injected by JS -->
          </div>
        </div>

        <a href="#/pallets" class="nav-link" data-icon="pallets">
          <span class="icon">🛒</span><span class="text">Pallet Monitoring</span>
        </a>

        <a href="#/sds" class="nav-link" data-icon="sds">
          <span class="icon">🧪</span><span class="text">SDS Chemicals</span>
        </a>

        <a href="#/suppliers" class="nav-link" data-icon="suppliers">
          <span class="icon">🤝</span><span class="text">Suppliers</span>
        </a>

        <a href="#/po" class="nav-link" data-icon="po">
          <span class="icon">🧾</span><span class="text">Purchase Orders</span>
        </a>

        <a href="#/reports" class="nav-link" data-icon="reports">
          <span class="icon">📊</span><span class="text">Reports</span>
        </a>

        <a href="#/settings" class="nav-link" data-icon="settings">
          <span class="icon">⚙️</span><span class="text">Settings</span>
        </a>
      </nav>

      <footer class="sidebar-footer">
        <small>© Woodward Foods · v0.1</small>
      </footer>
    </aside>

    <!-- Main -->
    <main class="main" id="main">
      <header class="topbar">
        <h1 id="pageTitle">Home</h1>
        <div class="spacer"></div>
        <button id="themeToggle" class="btn-ghost" title="Toggle theme" aria-label="Toggle theme">Dark</button>
        <div class="status">
          <span class="pill pill-blue">view only</span>
        </div>
      </header>

      <section class="page" id="page">
        <!-- content injected by JS -->
      </section>
    </main>

  </div>

  <!-- App entry -->
  <script type="module" src="./js/main.js?v=3"></script>
</body>
</html>
